- name: Manage Grafana Alloy
  hosts: monitoring_nodes

  tasks:
    - name: Ensure Grafana Alloy is installed
      ansible.builtin.package:
        name: alloy
        state: present

    - name: Ensure Alloy configuration exists
      ansible.builtin.template:
        src: files/config.alloy.j2
        dest: /etc/alloy/config.alloy
        owner: root
        group: root
        mode: '0644'
      notify: Restart Alloy

    - name: Ensure Alloy is enabled and running
      ansible.builtin.systemd_service:
        name: alloy
        enabled: true
        state: started

  handlers:
    - name: Restart Alloy
      ansible.builtin.systemd_service:
        name: alloy
        state: restarted
