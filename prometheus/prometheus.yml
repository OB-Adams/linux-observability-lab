global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]
  - job_name: "observability"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          host: "observability"
  - job_name: "ubuntu-server"
    static_configs:
      - targets: ["192.168.0.20:9100"]
        labels:
          host: "ubuntu-server"
  - job_name: "rocky-server"
    static_configs: 
      - targets: ["192.168.0.10:9100"]
        labels:
          host: "rocky-linux" 
